# PIC32CM GC00 Curiosity Pro: shell on SERCOM4 / PKoB4 VCOM
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_PROMPT_UART="curiosity:~$ "

# Shell owns this UART; avoid interleaving a second UART console.
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Built-in inspection commands used in the demonstration.
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
